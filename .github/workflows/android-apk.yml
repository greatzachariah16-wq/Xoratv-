name: Build XoraTV Android debug APK

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "mobile/capacitor-android/**"
      - "mobile/capacitor-web/**"
      - "scripts/apply-xora-android.mjs"
      - "src/lib/native-startup.ts"
      - "src/routes/__root.tsx"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept SDK licences and install Android 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Capacitor and web dependencies
        run: npm install

      - name: Generate Android project and apply Xora native startup
        run: npm run cap:add:android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare downloadable test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk XoraTV-Android-Test.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xoratv-android-debug
          path: XoraTV-Android-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test APK to public XoraTV download release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xoratv-android-test
          name: XoraTV Android Test Build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: XoraTV-Android-Test.apk
