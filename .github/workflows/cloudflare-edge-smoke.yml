name: Cloudflare edge API smoke test

on:
  push:
    branches:
      - cloudflare-backend-staging
    paths:
      - "cloudflare/backend/**"
      - ".github/workflows/cloudflare-edge-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed Cloudflare Worker
        run: node cloudflare/backend/smoke-test.mjs
