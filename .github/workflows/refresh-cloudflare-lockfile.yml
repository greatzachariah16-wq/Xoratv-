name: Refresh npm lockfile for Cloudflare
on:
  push:
    branches:
      - cloudflare-backend-staging
    paths:
      - .github/workflows/refresh-cloudflare-lockfile.yml
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-backend-staging
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package lock from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package lock for Cloudflare build"
          git push origin HEAD:cloudflare-backend-staging
