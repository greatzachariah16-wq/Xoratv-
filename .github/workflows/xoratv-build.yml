name: Validate XoraTV build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: TypeScript and lint regression validation
        env:
          XORA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/check-pr-regressions.mjs
