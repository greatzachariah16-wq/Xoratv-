name: Validate XoraTV build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm install
      # TanStack Start regenerates its route tree during the Vite build.
      # Build first so the typecheck reads the generated route tree, not a stale file.
      - name: Build application
        run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Project lint
        if: always()
        run: npm run lint
