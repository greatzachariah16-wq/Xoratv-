services:
  - type: web
    name: xoratv
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: MEDIA_ROOT
        value: ./media
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: VITE_RENDER_BACKEND_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: xora-tv.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: xora-tv
      - key: VITE_FIREBASE_DATABASE_URL
        value: https://xora-tv-default-rtdb.firebaseio.com
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: xora-tv.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "977340710920"
      - key: VITE_FIREBASE_APP_ID
        value: 1:977340710920:web:f567f6ced49ea56e05d1bd
      - key: FIREBASE_DATABASE_URL
        value: https://xora-tv-default-rtdb.firebaseio.com
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: MELE_DATA_API_KEY
        sync: false
